# HAJAR on Hostinger VPS
# Public: https://hajar.pk · https://api.hajar.pk · https://dashboard.hajar.pk
# Direct: API :3310 · web :3311 · dashboard :3312
#
# TLS and routing are handled by the host's nginx (/etc/nginx/sites-enabled/hajar.pk,
# certificates from certbot), which proxies to the ports above. Ports 80/443
# belong to that nginx, so this stack must not publish them.
services:
  api:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3310:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      CORS_ORIGIN: ${CORS_ORIGIN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w api
        exec node api/dist/main.js

  web:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3311:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: "3001"
      NODE_OPTIONS: --max-old-space-size=3072
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    depends_on:
      api:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w web
        cd /src/web
        exec npx next start -p 3001

  dashboard:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3312:4173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      web:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w dashboard
        exec npx --yes serve -s dashboard/dist -l 4173
