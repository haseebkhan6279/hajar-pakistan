# HAJAR on Hostinger VPS — host ports chosen to avoid existing stacks.
# Storefront :3311 · API :3310 · Dashboard :3312
#
# Uses public images + git clone at start (Hostinger Docker Manager does not
# reliably build from remote git contexts on this VPS).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - hajar_mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: hajar
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3310:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://hajar:${MONGO_PASSWORD}@mongo:27017/hajar?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_ON_BOOT: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w api
        exec node api/dist/main.js

  web:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3311:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: "3001"
      NODE_OPTIONS: --max-old-space-size=3072
    depends_on:
      - api
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w web
        cd /src/web
        exec npx next start -p 3001

  dashboard:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3312:4173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w dashboard
        exec npx --yes serve -s dashboard/dist -l 4173

volumes:
  hajar_mongo_data:
