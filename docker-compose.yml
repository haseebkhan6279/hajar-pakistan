# HAJAR on Hostinger VPS
# Public: https://hajar.pk · https://api.hajar.pk · https://admin.hajar.pk
# Direct: API :3310 · web :3311 · admin :3312
#
# Port 80 is taken on this VPS, so Caddy publishes HTTPS on :443 only
# (TLS-ALPN-01). Point DNS A records for @/www/api/admin to 187.127.213.181.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - hajar_mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: hajar
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3310:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: ${MONGODB_URI:-mongodb://hajar:${MONGO_PASSWORD}@mongo:27017/hajar?authSource=admin}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      CORS_ORIGIN: ${CORS_ORIGIN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w api
        exec node api/dist/main.js

  web:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3311:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: "3001"
      NODE_OPTIONS: --max-old-space-size=3072
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s
    depends_on:
      api:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w web
        cd /src/web
        exec npx next start -p 3001

  dashboard:
    image: node:22-bookworm
    working_dir: /src
    restart: unless-stopped
    ports:
      - "3312:4173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      web:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        if [ ! -d /src/.git ]; then
          git clone --depth 1 https://github.com/haseebkhan6279/hajar-pakistan.git /src
        else
          cd /src && git fetch --depth 1 origin main && git reset --hard origin/main
        fi
        cd /src
        npm ci
        npm run build -w dashboard
        exec npx --yes serve -s dashboard/dist -l 4173

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - hajar_caddy_data:/data
      - hajar_caddy_config:/config
    depends_on:
      - api
      - web
      - dashboard
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        {
          auto_https disable_redirects
        }
        hajar.pk, www.hajar.pk {
          encode gzip
          reverse_proxy web:3001
        }
        api.hajar.pk {
          encode gzip
          reverse_proxy api:3000
        }
        admin.hajar.pk {
          encode gzip
          reverse_proxy dashboard:4173
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  hajar_mongo_data:
  hajar_caddy_data:
  hajar_caddy_config:
